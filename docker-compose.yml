# Local development database.
# Both developers get a byte-identical Postgres 16 — the same major version Neon runs
# in production — so a migration that applies locally applies there too.
#
#   npm run db:up      start
#   npm run db:down    stop
#   npm run db:logs    tail
#
# Host port is 5433, not 5432, on purpose: 5432 is commonly already taken by another
# project's container or a local Homebrew Postgres. Binding a dedicated port means
# TutorNow starts regardless of what else is running.
#
# Connection string for server/.env (PR 0.9 documents the full env list):
#   DATABASE_URL="postgresql://tutor:tutor@localhost:5433/tutor_now?schema=public"

services:
  db:
    image: postgres:16
    container_name: tutor_now_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor_now
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutor -d tutor_now']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
