# Render Blueprint — the server half of the deploy (PR 0.9).
#
# Committed rather than clicked into the dashboard for the same reason
# client/vercel.json is: infrastructure that can be diffed and reviewed beats
# infrastructure that lives in a form nobody can see the history of.
#
# Render reads this on Blueprint sync. A service created by hand in the
# dashboard does NOT pick it up — create the service from this file
# (Dashboard → New → Blueprint), or the two drift silently.
#
# Full walkthrough, including everything that cannot be expressed here (the Neon
# project, the seed, rollbacks, logs): docs/DEPLOYMENT.md § "Server → Render + Neon".

services:
  - type: web
    name: tutor-now-api
    runtime: node
    plan: free
    region: frankfurt # Closest region to the users and to the Neon project. The two must match — a cross-region hop is added to every single query.
    branch: main
    autoDeploy: true

    # The repo root, not server/. Three reasons, all of them structural:
    #   - npm workspaces: the lockfile that resolves @tutor/shared lives here.
    #   - prisma.config.js is here and declares `schema: prisma/schema` as a
    #     path relative to cwd. Run the CLI from server/ and it finds neither
    #     the config nor the schema folder.
    #   - server/src/config/env.js resolves the repo root from its own location,
    #     so it does not care — but the two above do.
    rootDir: .

    # Render polls this to decide whether the instance is alive. Mounted at the
    # root, not under /api/v1, and it never returns 500 even when the database
    # is down — see server/src/routes/health.routes.js for why that matters.
    healthCheckPath: /health

    # `npm ci` not `npm install`: the lockfile is the whole point of committing one.
    # `migrate deploy` (not `migrate dev`) applies pending migrations and never
    # generates or resets — the only Prisma migrate command safe to point at a
    # production database.
    # `generate` runs last so the client is built against the schema that was
    # just applied. If migrate fails, the deploy stops here and the old instance
    # keeps serving; Render only swaps traffic over after a successful build.
    buildCommand: npm ci && npx prisma migrate deploy && npx prisma generate

    startCommand: npm run start -w server

    envVars:
      # ── build environment ────────────────────────────────────────────────
      - key: NODE_VERSION
        value: 24 # Matches .nvmrc and engines.node. Render does not read .nvmrc.

      # Render sets NODE_ENV=production, and npm reads that as --omit=dev. The
      # Prisma CLI is a devDependency, so without this the build command dies on
      # `prisma: not found` before a single migration runs. Same trap as Vercel
      # in PR 0.8, same fix.
      - key: NPM_CONFIG_INCLUDE
        value: dev

      - key: NODE_ENV
        value: production

      # PORT is injected by Render and must not be declared here. env.js reads it
      # with a default of 3000 for local use; in the deployed service Render's
      # value wins, and binding to anything else makes the instance unreachable.

      # ── secrets — set in the dashboard, never in this file ────────────────
      # `sync: false` means "this service requires this variable, ask me for the
      # value". The name is safe to commit; the value never is.

      # The Neon connection string. Use the DIRECT (unpooled) one — the host
      # WITHOUT `-pooler` in it. PgBouncer in transaction mode breaks the
      # advisory locks `prisma migrate deploy` takes out, and one free instance
      # does not open enough connections to need pooling.
      # See docs/DEPLOYMENT.md § "Pooled vs direct" before switching this.
      - key: DATABASE_URL
        sync: false

      # Generated by Render, never seen by anyone, different from the local
      # values by construction. Two separate secrets on purpose: a leaked access
      # secret must not be able to mint refresh tokens.
      # Regenerating either one invalidates every issued token — that is the
      # intended behaviour if one ever leaks.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Comma-separated exact origins, no wildcards (env.js splits on commas).
      # The Vercel production origin from PR 0.8 goes here.
      - key: CORS_ORIGINS
        sync: false

      # ── required in production by env.js, even though their epic (E3) has
      #    not started ───────────────────────────────────────────────────────
      # `requiredInProduction` in server/src/config/env.js exits the process on
      # boot if any of these four is missing. That is deliberate — a deployed
      # instance missing a key should fail loudly at startup, not at 2 AM in a
      # request handler. The consequence for this PR is that the accounts have
      # to exist before the first successful deploy.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── optional until their epic lands ──────────────────────────────────
      # Declared so the dashboard shows the full shape of the environment.
      # Leave blank until E5 / E6; env.js treats them as optional.
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
